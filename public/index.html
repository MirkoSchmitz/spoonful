<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spoonful</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;500;600;700&family=Outfit:wght@700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, appetitlich, aufgeräumt – ein Küchenhelfer, kein Magazin.
   IDEA: eine Rezeptkartei – Karten mit Foto, Reiter für Kategorien.
   PICTURE: das Kartenraster selbst; Detail mit großem Tellerfoto.
   COLOUR and TYPE: Tomatenrot als Kopfband, Basilikum für Ernährung, Safran als Akzent; Fraunces + Figtree.
   LAYOUT: Kopfband, Filterreiter, Raster; Detail zweispaltig ab 820px, darunter gestapelt. */
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#16110e);--ink:light-dark(#1f1915,#f5efe8);--muted:light-dark(#6d635b,#b5aaa0);
 --line:light-dark(#ebe4dc,#2f2722);--card:light-dark(#ffffff,#201914);--soft:light-dark(#f7f3ef,#241c17);
 --tomato:light-dark(#2e6a39,#2c6536);--tomato-ink:#fff;--basil:light-dark(#2e6a39,#86c792);--basil-soft:light-dark(#e6f1e7,#1d2c20);--heart:light-dark(#d33a20,#ff7a66);
 --saffron:#f3b300;--danger:light-dark(#b3261e,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.08;text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.top{background:var(--tomato);color:var(--tomato-ink);padding:calc(18px + env(safe-area-inset-top)) 0 18px}
.top-in{max-width:1180px;margin:auto;padding:0 max(5vw,16px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-right:auto}
.brand h1{font-family:Outfit,Figtree,sans-serif;font-size:clamp(34px,6vw,46px);font-weight:700;letter-spacing:-.04em;display:flex;align-items:baseline;line-height:1}
.brand h1 svg{height:.74em;width:.62em;flex:none;margin:0 .05em -.2em .02em}
.quick .chip[aria-pressed=true]{background:var(--saffron);border-color:var(--saffron);color:#1f1915}
.chip svg,.fav svg{width:16px;height:16px;vertical-align:-3px}
.facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--muted)}
.facts b{font-weight:600;color:var(--ink)}
.card{position:relative}
.card .heart{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--heart)}
.card .heart svg{width:16px;height:16px}
.fav[aria-pressed=true]{color:var(--heart);border-color:var(--heart)}
.fav[aria-pressed=true] svg path{fill:currentColor}
.field select{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:16px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tag.sample{background:var(--saffron);color:#1f1915}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost-light{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
.btn.danger{color:var(--danger);border-color:currentColor;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.wrap{max-width:1180px;margin:auto;padding:0 max(5vw,16px)}
.search{margin-top:20px;display:flex;gap:10px}
.search input{flex:1;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);padding:0 16px;font-size:16px}
.filters{margin-top:14px;display:grid;gap:8px}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .lbl{flex:none;align-self:center;font-size:13px;color:var(--muted);width:76px}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:14px;font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.diet[aria-pressed=true]{background:var(--basil);border-color:var(--basil);color:light-dark(#fff,#0f1a11)}
.meta-line{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px;color:var(--muted);font-size:14px;gap:10px}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;min-height:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:16px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.ph{aspect-ratio:4/3;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{width:44%;opacity:.55}
.card-b{padding:10px 12px 14px}
.card h3{font-size:17px;font-weight:600;font-family:Figtree,sans-serif;line-height:1.25}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.diet{background:var(--basil-soft);color:var(--basil)}
.empty{border:2px dashed var(--line);border-radius:22px;padding:40px 24px;text-align:center;margin-top:12px}
.empty h2{font-size:28px;margin-bottom:8px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:46ch}
.fab{position:fixed;right:max(5vw,16px);bottom:calc(20px + env(safe-area-inset-bottom));min-height:56px;padding:0 24px;border-radius:999px;border:0;background:var(--tomato);color:#fff;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:5}
.note{background:var(--soft);border-radius:14px;padding:12px 16px;font-size:14px;color:var(--muted);margin-top:16px}
/* Detail */
.hero{position:relative;background:var(--soft);aspect-ratio:4/3;width:min(100%,calc(64vh * 4 / 3));margin:0 auto;overflow:hidden;display:grid;place-items:center}
@media(min-width:820px){.hero{margin-top:20px;border-radius:22px}}
.hero img{width:100%;height:100%;object-fit:cover}
.hero svg{width:120px;opacity:.5}
.credit{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;padding:3px 8px;border-radius:8px}
.back{position:absolute;left:max(5vw,16px);top:calc(14px + env(safe-area-inset-top));background:rgba(0,0,0,.55);color:#fff;border:0}
.d-head{padding-top:22px}
.d-head h2{font-size:clamp(32px,6vw,48px);font-weight:800}
.d-head p{color:var(--muted);max-width:65ch;margin:10px 0 0;font-size:17px}
.by{font-size:13px;color:var(--muted);margin-top:10px}
.cols{display:grid;gap:28px;margin-top:28px}
@media(min-width:820px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px}}
.panel h3{font-size:24px;margin-bottom:14px}
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:999px;width:max-content;margin-bottom:16px;background:var(--soft)}
.stepper button{width:48px;height:48px;border:0;background:transparent;font-size:24px;font-weight:600;border-radius:999px}
.stepper output{min-width:118px;text-align:center;font-weight:700;font-size:17px}
.ings{list-style:none;margin:0;padding:0}
.ings li{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ings .q{font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ings .q.changed{color:var(--tomato)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:17px}
.steps li::before{content:counter(s);font-family:Fraunces,serif;font-weight:800;font-size:26px;color:var(--tomato);line-height:1}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:32px 0}
/* Form */
.form{max-width:760px;margin:auto;padding-top:22px}
.form h2{font-size:clamp(28px,5vw,40px);margin-bottom:18px}
.field{display:grid;gap:6px;margin-bottom:18px}
.field>span{font-weight:600;font-size:15px}
.field input,.field textarea,.row input{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px 14px;font-size:16px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.photo-box{border:2px dashed var(--line);border-radius:18px;overflow:hidden}
.photo-box .ph{aspect-ratio:4/3;max-width:480px}
.photo-btns{display:flex;gap:8px;flex-wrap:wrap;padding:12px}
.photo-btns label{position:relative}
.photo-btns input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.catgrid{display:grid;gap:10px}
.catgrid .chiprow{flex-wrap:wrap;overflow:visible}
.row{display:grid;grid-template-columns:5.5em 6.5em minmax(0,1fr) 44px;gap:8px;margin-bottom:8px;align-items:center}
.row.step{grid-template-columns:28px minmax(0,1fr) 44px;align-items:start}
.row.step textarea{min-height:64px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px 14px;font-size:16px;width:100%;resize:vertical}
.row .num{font-family:Fraunces,serif;font-weight:800;color:var(--tomato);font-size:20px;padding-top:10px;text-align:center}
.x{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-size:20px;color:var(--muted)}
@media(max-width:520px){.row{grid-template-columns:4.6em 5.4em minmax(0,1fr) 40px;gap:6px}.x{width:40px}.row input{padding:10px 8px}}
.sticky-save{position:sticky;bottom:0;background:var(--bg);padding:14px 0 calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;border-top:1px solid var(--line);margin-top:10px;z-index:4}
.sticky-save .btn.primary{flex:1}
/* Overlay */
.ov{position:fixed;inset:0;background:rgba(10,6,4,.55);display:grid;place-items:end center;z-index:20;padding:16px}
@media(min-width:640px){.ov{place-items:center}}
.sheet{background:var(--bg);border-radius:22px;padding:22px;width:min(560px,100%);max-height:88vh;overflow:auto}
.sheet h2{font-size:26px;margin-bottom:8px}
.sheet p{color:var(--muted);margin:0 0 14px}
.sheet .btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;z-index:30;max-width:90vw}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.card{transition:none}}
.hidden{display:none!important}
/* Tab Bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding:6px max(2vw,8px) calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.05)}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border:0;background:none;color:var(--muted);font-size:10.5px;font-weight:600;text-decoration:none;padding:0}
.tabbar svg{width:24px;height:24px}
.tabbar [aria-current=page]{color:var(--tomato)}
.tabbar [aria-current=page] svg path{fill:currentColor;fill-opacity:.16}
.tabbar .add .plus{width:44px;height:44px;border-radius:50%;background:var(--tomato);display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 16px rgba(46,106,57,.35)}
.tabbar .add .plus svg{width:22px;height:22px}
@media(min-width:900px){.tabbar{left:50%;right:auto;transform:translateX(-50%);width:660px;bottom:14px;border:1px solid var(--line);border-radius:22px;padding-bottom:6px}}
/* Kategorie-Reihen */
.cat{margin-top:26px}
.cat-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.cat-h h2{font-size:24px;font-weight:800}
.cat-h a{color:var(--muted);font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.rail-w{position:relative}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(62%,250px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:max(5vw,16px);padding:2px max(5vw,16px) 10px;margin:0 calc(-1 * max(5vw,16px));scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail>.cardw{scroll-snap-align:start}
.rail-btn{display:none}
@media(hover:hover) and (min-width:700px){.rail-btn{display:grid;place-items:center;position:absolute;top:calc(50% - 30px);width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:2;font-size:20px}.rail-btn.prev{left:-12px}.rail-btn.next{right:-12px}}
@media(min-width:1240px){.rail{margin:0;padding-inline:2px;scroll-padding-inline:0}}
.cardw{position:relative;display:flex}
.cardw>.card{flex:1}
.heart-btn{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:var(--heart);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:1}
.heart-btn svg{width:20px;height:20px}
.page-h{display:flex;align-items:center;gap:12px;margin:22px 0 6px}
.page-h h2{font-size:clamp(28px,6vw,38px);font-weight:800}
/* Kategorien verwalten */
.cm-row{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px 44px;gap:6px;margin-bottom:8px;align-items:center}
.cm-row input{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:16px;width:100%}
.cm-row button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:18px}
.cm-row button:disabled{opacity:.35}
/* Inspiration */
.insp-box{position:relative;margin-top:8px}
.insp-box textarea{width:100%;min-height:104px;border-radius:16px;border:1.5px solid var(--line);background:var(--soft);padding:14px 60px 14px 16px;font-size:17px;resize:vertical}
.mic{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12);display:grid;place-items:center}
.mic svg{width:22px;height:22px}
.mic.on{background:var(--heart);color:#fff}
@media(prefers-reduced-motion:no-preference){.mic.on{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(211,58,32,.18)}}}
.ideas-q{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.idea-card{display:flex;flex-direction:column;width:100%;text-align:left;padding:0;font:inherit;color:inherit;cursor:pointer}
.idea-card p{margin:6px 0 0;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.saved-badge{position:absolute;top:8px;left:8px;background:var(--tomato);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.idea-photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block;background:var(--soft)}
.idea-sheet h3{font-size:20px;margin:14px 0 8px}
.idea-sheet ul,.idea-sheet ol{padding-left:20px;margin:0}
.idea-sheet li{padding:3px 0}
/* Wochenplan */
.week-nav{display:flex;align-items:center;gap:8px;margin:6px 0 14px}
.week-nav b{flex:1;text-align:center;font-size:15px}
.week-nav .btn{min-width:44px;padding:0 12px}
.days{display:grid;gap:12px}
@media(min-width:900px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
.day{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.day.today{border-color:var(--tomato);box-shadow:0 0 0 1px var(--tomato)}
.day.past{opacity:.6}
.day-h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.day-h b{font-size:16px}
.day-h small{color:var(--muted);font-size:13px}
.day-h .now{background:var(--tomato);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.pi{display:grid;grid-template-columns:56px minmax(0,1fr) auto 40px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.pi:first-of-type{border-top:0}
.pi .th{width:56px;height:42px;border-radius:9px;overflow:hidden;background:var(--soft);color:var(--muted);display:grid;place-items:center}
.pi .th img{width:100%;height:100%;object-fit:cover}
.pi .th svg{width:30px}
.pi a,.pi .tx{font-weight:600;color:inherit;text-decoration:none;line-height:1.25;overflow-wrap:anywhere}
.pi .tx{font-weight:500;font-style:italic}
.pi .x{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:20px}
.mini-step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;font-size:13px}
.mini-step button{width:30px;height:32px;border:0;background:transparent;font-size:17px;font-weight:700}
.mini-step span{min-width:30px;text-align:center;font-weight:700}
.day-add{display:flex;gap:8px;margin-top:8px}
.day-add .btn{min-height:38px;font-size:14px;padding:0 12px}
.pick-list{display:grid;gap:6px;max-height:50vh;overflow:auto;margin-top:10px}
.pick{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:6px;font:inherit;color:inherit}
.pick .th{width:56px;height:42px;border-radius:8px;overflow:hidden;background:var(--soft);display:grid;place-items:center;color:var(--muted)}
.pick .th img{width:100%;height:100%;object-fit:cover}.pick .th svg{width:30px}
.pick small{display:block;color:var(--muted);font-size:12px}
.daypick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.daypick button{border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:8px 10px;text-align:left;font:inherit;color:inherit;min-height:52px}
.daypick button b{display:block;font-size:14px}
.daypick button small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fill-list{display:grid;gap:6px;margin-top:10px}
.fill-row{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card)}
.fill-row b{min-width:72px;font-size:14px}
/* Inspiration-Umschalter, Vorrat */
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px;margin:4px 0 6px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:40px;padding:0 16px;font:inherit;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs .t{position:relative;width:84px;height:64px;border-radius:10px;overflow:hidden;background:var(--soft)}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t button{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px}
.have{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

function parseQty(str){
  if (str == null) return null;
  let s = String(str).trim().replace(/½/g,' 1/2').replace(/¼/g,' 1/4').replace(/¾/g,' 3/4').replace(/⅓/g,' 1/3').replace(/⅔/g,' 2/3').replace(',', '.').trim();

  let v = m[1] ? parseFloat(m[1]) : 0;
  if (m[2] && +m[3]) v += (+m[2]) / (+m[3]);

}
function frac(v){
  const w = Math.floor(v + 1e-9), r = Math.round((v - w) * 4) / 4;

function fmtQty(q, unit){

  return v.toLocaleString('de-DE');
}
// F-18: große/kleine Mengen in passende Einheit umrechnen
function normUnit(q, unit){

  if (l === 'ml' && q >= 1000) return { q: q/1000, unit: 'l' };

}

// ---------- Bild verkleinern ----------
async function compress(file){
  let src;
  try { src = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = src.width, h = src.height, k = Math.min(1, 1600 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w*k); c.height = Math.round(h*k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', 0.82));
}

async function loadSource(fileOrBlob){
  let src;
  try { src = await createImageBitmap(fileOrBlob, { imageOrientation: 'from-image' }); }
  catch { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(fileOrBlob); }); }
  const k = Math.min(1, 2400 / Math.max(src.width, src.height));
  const c = document.createElement('canvas'); c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}
function openCrop(canvas, init){
  return new Promise(resolve => {
    const url = canvas.toDataURL('image/jpeg', 0.9);
    sheet(`<h2>Bildausschnitt wählen</h2><p>Verschiebe das Foto mit dem Finger oder der Maus und zoome, bis das Essen gut im Rahmen sitzt. So erscheint es in der Übersicht und im Rezept.</p>
      <div class="crop" id="cropBox"><img id="cropImg" src="${url}" alt="Foto zum Zuschneiden"><span class="grid3"></span></div>
      <label class="zoom"><span>Zoom</span><input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1" aria-label="Zoom"></label>
      <div class="btns"><button class="btn" data-c="cancel">Abbrechen</button><button class="btn primary" data-c="ok">Übernehmen</button></div>`, ov => {
      const box = $('#cropBox', ov), img = $('#cropImg', ov), zoomEl = $('#cropZoom', ov);
      const iw = canvas.width, ih = canvas.height;
      let W = 0, H = 0, s0 = 1, z = 1, x = 0, y = 0;
      const clamp = () => { const s = s0 * z; x = Math.min(0, Math.max(W - iw * s, x)); y = Math.min(0, Math.max(H - ih * s, y)); };
      const draw = () => { clamp(); img.style.transform = `translate(${x}px,${y}px) scale(${s0 * z})`; img.style.width = iw + 'px'; img.style.height = ih + 'px'; };
      const measure = () => {
        const oldS = s0 * z, cx = W ? (W / 2 - x) / oldS : iw / 2, cy = H ? (H / 2 - y) / oldS : ih / 2;
        W = box.clientWidth; H = box.clientHeight; s0 = Math.max(W / iw, H / ih);
        x = W / 2 - cx * s0 * z; y = H / 2 - cy * s0 * z; draw();
      };
      if (init && init.z >= 1 && init.z <= 4) { z = init.z; zoomEl.value = z; }
      const start = init && init.cx >= 0 && init.cx <= 1 && init.cy >= 0 && init.cy <= 1 ? init : null;
      const zoomTo = (nz, px = W / 2, py = H / 2) => { nz = Math.min(4, Math.max(1, nz)); const s = s0 * z, ns = s0 * nz; x = px - (px - x) * ns / s; y = py - (py - y) * ns / s; z = nz; zoomEl.value = z; draw(); };
      const ro = new ResizeObserver(() => {
        if (start && !W) { W = box.clientWidth; H = box.clientHeight; s0 = Math.max(W / iw, H / ih); x = W / 2 - start.cx * iw * s0 * z; y = H / 2 - start.cy * ih * s0 * z; draw(); return; }
        measure();
      }); ro.observe(box);
      const pts = new Map(); let pinch = null;
      box.addEventListener('pointerdown', e => { box.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z }; } box.style.cursor = 'grabbing'; });
      box.addEventListener('pointermove', e => {
        const prev = pts.get(e.pointerId); if (!prev) return;
        const cur = { x: e.clientX, y: e.clientY }; pts.set(e.pointerId, cur);
        if (pts.size === 2 && pinch) {
          const [a, b] = [...pts.values()], r = box.getBoundingClientRect();
          zoomTo(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
        } else if (pts.size === 1) { x += cur.x - prev.x; y += cur.y - prev.y; draw(); }
      });
      const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; box.style.cursor = 'grab'; };
      box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
      box.addEventListener('wheel', e => { e.preventDefault(); const r = box.getBoundingClientRect(); zoomTo(z * (e.deltaY < 0 ? 1.08 : 1 / 1.08), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
      zoomEl.addEventListener('input', () => zoomTo(+zoomEl.value));
      const finish = async ok => {
        ro.disconnect();
        if (!ok) { closeSheet(); resolve(null); return; }
        const s = s0 * z, sx = -x / s, sy = -y / s, sw = W / s, sh = H / s;
        const ow = Math.round(Math.min(1600, sw)), oh = Math.round(ow * 3 / 4);
        const out = document.createElement('canvas'); out.width = ow; out.height = oh;
        out.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, ow, oh);
        const crop = { cx: +((sx + sw / 2) / iw).toFixed(4), cy: +((sy + sh / 2) / ih).toFixed(4), z: +z.toFixed(3) };
        out.toBlob(b => { closeSheet(); resolve(b ? { blob: b, crop } : null); }, 'image/jpeg', 0.85);
      };
      ov.addEventListener('click', e => { const c = e.target.closest('[data-c]')?.dataset.c; if (c) finish(c === 'ok'); else if (e.target === ov) finish(false); });
    });
  });
}

function filtered(){
  const q = S.q.trim().toLowerCase();
  return S.recipes.filter(r => {
    const cats = r.cats || [];
    if (S.meal.length && !S.meal.some(c => cats.includes(c))) return false;
    if (S.diet.length && !S.diet.some(c => cats.includes(c))) return false;
    if (S.quick.includes('fav') && !isFav(r)) return false;
    if (S.quick.includes('fast') && !(r.time && r.time <= 30)) return false;
    if (S.quick.includes('easy') && r.level !== 'leicht') return false;
    if (S.quick.includes('light') && !(nutriOk(r) && r.nutrition.kcal < 600)) return false;
    if (S.tags.length && !S.tags.some(t => (r.tags || []).includes(t))) return false;
    if (q) {
      const hay = [r.name, r.desc, ...(r.tags || []), ...(r.ingredients||[]).map(i => i.name)].join(' ').toLowerCase();
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
}

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

// Spracheingabe (Web Speech API) für ein Textfeld
const micHTML = id => SpeechRec ? `<button type="button" class="mic ${rec?._id === id ? 'on' : ''}" id="${id}" data-mic aria-pressed="${rec?._id === id}" aria-label="${rec?._id === id ? 'Spracheingabe beenden' : 'Spracheingabe starten'}">${MIC}</button>` : '';
const micHint = () => SpeechRec ? '' : '<p class="by" style="margin:6px 0 0">Tipp: Zum Sprechen das Mikrofon deiner Handy-Tastatur nutzen.</p>';
function startMic(btn, ta, onChange){
  if (rec) { const same = rec._id === btn.id; try { rec.stop(); } catch {} if (same) return; }
  if (!SpeechRec || !ta) return;
  const base = ta.value.trim(), id = btn.id;
  const show = on => { const b = document.getElementById(id); if (b) { b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-label', on ? 'Spracheingabe beenden' : 'Spracheingabe starten'); } };
  try {
    const r = new SpeechRec(); rec = r; r._id = id; r.lang = 'de-DE'; r.interimResults = true; r.continuous = false;
    r.onresult = e => { let t = ''; for (const x of e.results) t += x[0].transcript; const v = (base ? base + ' ' : '') + t; const cur = document.getElementById(ta.id) || ta; cur.value = v; onChange?.(v); };
    r.onerror = e => toast(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'Mikrofon wurde nicht erlaubt – bitte in den Einstellungen freigeben.' : e.error === 'no-speech' ? 'Nichts gehört – bitte nochmal.' : 'Spracheingabe hat nicht geklappt.');
    r.onend = () => { if (rec === r) rec = null; show(false); };
    r.start(); show(true);
  } catch { rec = null; toast('Spracheingabe ist hier nicht verfügbar.'); }
}
const stopMic = () => { if (rec) { try { rec.stop(); } catch {} } };

function ideaCard(r, i, src){

function ideaPrompt(task, avoid, extraField){
  const names = S.recipes.map(r => r.name).slice(0, 80).join('; ');
  return `Du bist ein Koch-Assistent für ein Paar in Deutschland. ${task}
Nicht vorschlagen (schon im Kochbuch${avoid.length ? ' oder eben schon vorgeschlagen' : ''}): ${[names, ...avoid].filter(Boolean).join('; ') || '–'}.
Antworte NUR mit JSON in dieser Form:
{"recipes":[{"name":string,"description":string (1–2 Sätze: was es ist und warum es passt),"servings":2,"time":number (Gesamtzeit in Minuten),"level":"leicht"|"mittel"|"anspruchsvoll","ingredients":[{"qty":number|null,"unit":string,"name":string}],"steps":[string],"categories":[string],"nutrition":{"kcal":number,"protein":number,"carbs":number,"fat":number} (Schätzung pro Portion, Gramm),${extraField || ''}"photoQuery":string}]}
Regeln: Alles auf Deutsch außer photoQuery. Mengen für 2 Portionen, metrische Einheiten (g, kg, ml, l, EL, TL, Stück, Prise, Zehe, Bund, Dose, Packung). Ohne Mengenangabe qty null und unit "". Schritte kurz, ohne Nummerierung. categories nur aus: ${ALLCATS.join(', ')}. photoQuery: 2–4 englische Wörter, die das fertige Gericht für eine Fotosuche beschreiben (z. B. "baked potato wedges").`;

function toIdea(j){
  const idea = {
    name: String(j.name).slice(0, 120), desc: String(j.description || '').slice(0, 600),
    servings: Math.max(1, Math.min(99, Math.round(+j.servings) || 2)),
    time: +j.time > 0 ? Math.round(+j.time) : null, level: LEVELS.includes(j.level) ? j.level : null,
    ingredients: (Array.isArray(j.ingredients) ? j.ingredients : []).map(i => ({ qty: i?.qty == null || i.qty === '' ? null : (typeof i.qty === 'number' ? i.qty : parseQty(i.qty)), unit: String(i?.unit || ''), name: String(i?.name || '') })).filter(i => i.name),
    steps: (Array.isArray(j.steps) ? j.steps : []).map(String).filter(Boolean),
    cats: (Array.isArray(j.categories) ? j.categories : []).filter(c => ALLCATS.includes(c)),

async function fetchIdeas(src, prompt){
  const I = S.inspo;
  stopMic();
  I.loading = true; I.error = ''; renderInspo();
  inspoCtl = new AbortController(); const ctl = inspoCtl;
  let ok = false;
  try {
    const list = await S.sample.inspire(prompt);
    if (ctl.signal.aborted) return false;
    const ideas = (Array.isArray(list) ? list : []).filter(r => r && r.name).slice(0, 6).map(toIdea);
    if (!ideas.length) throw { code: 'empty' };
    I[src].ideas = ideas; I[src].saved = {}; ok = true;
  } catch (e) {
    if (ctl.signal.aborted) return false;
    const c = e?.code;
    I.error = c === 'sampling_disabled' ? 'Für Vorschläge fehlt der Claude-API-Schlüssel in Supabase.' : c === 'empty' || c === 'invalid_json' ? 'Claude hat keine brauchbaren Vorschläge geliefert – bitte nochmal versuchen.' : c === 'outdated' || /inspire|unbekannt|Kein Inhalt/i.test(e?.message || '') ? 'Die Import-Funktion bei Supabase ist noch nicht auf dem neuesten Stand (siehe Anleitung).' : 'Das hat nicht geklappt – bitte gleich nochmal versuchen.';
  }
  I.loading = false;
  if (location.hash === '#inspiration') { renderInspo(); if (ok) $('#ideasTop')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  return ok;
}
async function getIdeas(more){
  const I = S.inspo, L = I.lust, wish = (more ? L.lastWish : I.wish).trim();
  if (!wish) { I.error = 'Schreib oder sag kurz, worauf ihr Lust habt.'; renderInspo(); $('#wish')?.focus(); return; }
  const avoid = more ? L.ideas.map(r => r.name) : [];
  const prev = L.lastWish; L.lastWish = wish;
  if (!await fetchIdeas('lust', ideaPrompt(`Ihr Wunsch: "${wish}".\nSchlage 4 abwechslungsreiche, realistische und gut nachkochbare Rezepte vor, die gut zu diesem Wunsch passen.`, avoid)) && !L.ideas.length) L.lastWish = prev;
}

// ---- Was ist da? ----
const BASICS = ['salz', 'pfeffer', 'öl', 'wasser', 'zucker', 'gewürz', 'brühe', 'essig', 'muskat', 'paprikapulver', 'oregano', 'chili', 'kreuzkümmel', 'zimt', 'backpulver', 'natron'];
const normWord = w => w.toLowerCase().replace(/[^a-zäöüß]/g, '');
const stem = w => w.length > 4 ? w.replace(/(en|er|n|e|s)$/, '') : w;
const isBasic = name => { const n = name.toLowerCase(); return BASICS.some(b => n.includes(b)); };
function hasIng(name, haveStems){
  const words = name.split(/[\s,/()\-+]+/).map(normWord).filter(w => w.length >= 3).map(stem);
  return words.some(w => haveStems.some(h => w === h || (h.length >= 4 && w.includes(h)) || (w.length >= 4 && h.includes(w))));
}
function pantryMatches(have){
  const hs = have.flatMap(h => h.split(/\s+/)).map(normWord).filter(w => w.length >= 3).map(stem);
  return S.recipes.map(r => {
    const need = (r.ingredients || []).filter(i => i.name && !isBasic(i.name));
    const got = need.filter(i => hasIng(i.name, hs));
    return { r, n: need.length, got: got.length, missing: need.filter(i => !got.includes(i)).map(i => i.name) };
  }).filter(m => m.n && m.got >= 1 && (m.missing.length <= 3 || m.got / m.n >= 0.6))
    .sort((a, b) => a.missing.length - b.missing.length || b.got - a.got).slice(0, 12);
}
function addHave(items){
  const P = S.inspo.pantry, seen = new Set(P.have.map(h => h.toLowerCase()));
  for (let it of items) { it = String(it || '').replace(/\s+/g, ' ').trim().slice(0, 40); if (it && !seen.has(it.toLowerCase())) { seen.add(it.toLowerCase()); P.have.push(it); } }
}
async function detectPantry(){
  const P = S.inspo.pantry; S.inspo.error = '';
  stopMic();
  const text = P.text.trim();
  if (text) addHave(text.split(/,|;|\n| und | sowie /i));
  if (P.photos.length) {
    P.detecting = true; renderInspo();
    try {
      const j = await S.sample.json(`Auf ${P.photos.length === 1 ? 'dem Foto' : 'den Fotos'} sind Kühlschrank, Vorratskammer oder Lebensmittel zu sehen. Liste alle erkennbaren Lebensmittel auf, die man zum Kochen verwenden kann – auf Deutsch, mit einfachen Namen (z. B. "Paprika", "Feta", "Haferflocken", "passierte Tomaten"), ohne Marken und ohne Mengen. Unsicheres nur aufnehmen, wenn es wahrscheinlich ist. Antworte NUR mit JSON: {"items":[string]}`, { images: P.photos.map(p => p.file) });
      const items = Array.isArray(j?.items) ? j.items : [];
      addHave(items);
      if (!items.length) S.inspo.error = 'Auf den Fotos waren keine Lebensmittel zu erkennen.';
      else { P.photos.forEach(p => URL.revokeObjectURL(p.url)); P.photos = []; }
    } catch (e) { S.inspo.error = e?.code === 'sampling_disabled' ? 'Für die Foto-Erkennung fehlt der Claude-API-Schlüssel in Supabase.' : 'Die Fotos konnten nicht ausgewertet werden – bitte nochmal versuchen.'; }
    P.detecting = false;
  }
  P.text = '';
  if (location.hash === '#inspiration') renderInspo();
}
async function findPantry(){
  const P = S.inspo.pantry; if (!P.have.length) return;
  P.matches = pantryMatches(P.have); P.searched = true; P.ideas = []; P.saved = {};
  await fetchIdeas('pantry', ideaPrompt(`Zu Hause ist vorhanden: ${P.have.join(', ')}.
Schlage 4 abwechslungsreiche, realistische Rezepte vor, die vor allem diese Zutaten verwenden und möglichst wenig zusätzlich brauchen. Grundzutaten (Salz, Pfeffer, Öl, Butter, Zucker, Mehl, Zwiebel, Knoblauch, übliche Gewürze, Brühe) gelten als vorhanden. Gib in "missing" an, was man zusätzlich kaufen müsste (leere Liste, wenn alles da ist).`, [], '"missing":[string],'));
}

function ideaBody(r){
  return { name: r.name, desc: r.desc, servings: r.servings, time: r.time, level: r.level, ingredients: r.ingredients, steps: r.steps, cats: r.cats, tags: [], nutrition: r.nutrition || null };
}
async function saveIdea(r, src, i){

// ---------- Wochenplan ----------
// Ein Dokument pro Tag: recipes/plan-YYYY-MM-DD = {type:'plan', date, items:[{k, rid, text, servings}]}
const PLAN_PREFIX = 'plan-';
const planItems = iso => S.plan[iso]?.items || [];
const pk = () => Math.random().toString(36).slice(2, 9);
async function setPlanDay(iso, items){
  const prev = S.plan[iso];
  S.plan[iso] = { ...(prev || {}), date: iso, items }; // sofort anzeigen
  try {
    const ref = S.db.collection('recipes').doc(PLAN_PREFIX + iso);
    if (items.length) await ref.set({ type: 'plan', date: iso, items, updatedAt: Date.now(), updatedBy: S.me || null });
    else await ref.delete();
  } catch { if (prev) S.plan[iso] = prev; else delete S.plan[iso]; toast('Plan konnte nicht gespeichert werden.'); }
  if (location.hash === '#plan') renderPlan();
}
const addToPlan = (iso, item) => setPlanDay(iso, [...planItems(iso), { k: pk(), ...item }]);
function weekStart(off){ const d = new Date(); d.setHours(0, 0, 0, 0); return addDays(d, -((d.getDay() + 6) % 7) + off * 7); }
function renderPlan(){
  setTab('plan');
  if (!S.loaded) { app.innerHTML = loadingHTML(); return; }
  const ws = weekStart(S.planWeek), today = todayIso();
  const days = [...Array(7)].map((_, i) => isoDay(addDays(ws, i)));
  const range = `${dayFromIso(days[0]).toLocaleDateString('de-DE', { day: 'numeric', month: 'short' })} – ${dayFromIso(days[6]).toLocaleDateString('de-DE', { day: 'numeric', month: 'short' })}`;

        ${S.canWrite && r ? `<span class="mini-step" role="group" aria-label="Portionen"><button type="button" data-pserv="${iso}|${it.k}|-1" aria-label="Weniger Portionen">−</button><span>${it.servings || r.servings || 2}</span><button type="button" data-pserv="${iso}|${it.k}|1" aria-label="Mehr Portionen">+</button></span>` : '<span></span>'}

    }

    ${proposal ? `<div class="fill-list">${proposal.map(p => `<div class="fill-row"><b>${esc(dayLabel(p.date))}</b><span>${esc(S.byId[p.id]?.name || '')}</span></div>`).join('')}</div>`

${JSON.stringify(S.recipes.slice(0, 150).map(r => ({ id: r.id, name: r.name, kat: r.cats || [], min: r.time || null })))}`;
      try {

let nutriBusy = false, nutriOff = false;
async function estimateNutrition(list){
  if (nutriOff || typeof S.sample?.json !== 'function' || !S.canWrite || !list.length) return 0;
  const items = list.slice(0, 8).filter(r => (r.ingredients || []).length);
  if (!items.length) return 0;
  const prompt = `Schätze die Nährwerte PRO PORTION für diese Rezepte (realistische Durchschnittswerte, übliche Lebensmitteldaten). Antworte NUR mit JSON:

// Bestehende Rezepte im Hintergrund nachziehen (höchstens 5 Durchgänge à 8 Rezepte pro Sitzung)
async function backfillNutrition(){
  if (nutriBusy || nutriOff || !S.canWrite || typeof S.sample?.json !== 'function') return;
  nutriBusy = true;

function route(){

  if (F && !h.startsWith('e-') && h !== 'neu') { if (F.previewUrl) URL.revokeObjectURL(F.previewUrl); F = null; }
  if (h !== 'kategorien') CM = null;
  if (h.startsWith('r-')) renderDetail(h.slice(2));
  else if (h.startsWith('e-')) renderForm(h.slice(2));
  else if (h === 'neu') renderForm(null);
  else if (h === 'suche') renderSearch();
  else if (h === 'favoriten') renderFavs();
  else if (h === 'inspiration') renderInspo();
  else if (h === 'plan') renderPlan();
  else if (h === 'kategorien') renderCats();
  else if (h.startsWith('k-')) renderCat(h.slice(2));
  else renderStart();
  if (S.lastHash !== h) window.scrollTo(0, 0);
  S.lastHash = h;
}

    if (!chip.closest('#form')) {
      const key = chip.dataset.chip, v = chip.dataset.v;
      S[key] = on ? [...S[key], v] : S[key].filter(x => x !== v);
      saveFilter(); renderSearch();
    }
    return;
  }
  const por = t.closest('[data-por]');
  if (por) {
    const id = location.hash.slice(3), r = S.byId[id]; if (!r) return;
    const base = r.servings || 1, d = +por.dataset.por;
    S.portions[id] = d === 0 ? base : Math.max(1, Math.min(99, (S.portions[id] || base) + d));
    const y = window.scrollY; renderDetail(id); window.scrollTo(0, y); return;
  }
  const go = t.closest('[data-go]'); if (go) { location.hash = go.dataset.go; return; }
  const pw = t.closest('[data-pweek]'); if (pw) { const d = +pw.dataset.pweek; S.planWeek = d === 0 ? 0 : S.planWeek + d; renderPlan(); return; }
  const padd = t.closest('[data-padd]'); if (padd) { openPickRecipe(padd.dataset.padd); return; }
  const pnote = t.closest('[data-pnote]'); if (pnote) { openPlanNote(pnote.dataset.pnote); return; }
  const prm = t.closest('[data-prm]'); if (prm) { const [iso, k] = prm.dataset.prm.split('|'); setPlanDay(iso, planItems(iso).filter(i => i.k !== k)); return; }
  const psv = t.closest('[data-pserv]'); if (psv) { const [iso, k, d] = psv.dataset.pserv.split('|'); setPlanDay(iso, planItems(iso).map(i => i.k === k ? { ...i, servings: Math.max(1, Math.min(99, (i.servings || S.byId[i.rid]?.servings || 2) + +d)) } : i)); return; }
  const pop = t.closest('[data-plan-open]'); if (pop && +pop.dataset.planOpen) { const id = pop.getAttribute('href').slice(3); S.portions[id] = +pop.dataset.planOpen; }
  const tq = t.closest('[data-tagq]'); if (tq) { S.tags = [tq.dataset.tagq]; S.meal = []; S.diet = []; S.quick = []; S.q = ''; saveFilter(); location.hash = 'suche'; return; }
  const act = t.closest('[data-act]')?.dataset.act;
  if (act === 'reset') { S.q = ''; S.meal = []; S.diet = []; S.quick = []; S.tags = []; saveFilter(); renderSearch(); return; }
  if (act === 'filters') { openFilters(); return; }
  if (act === 'import') { openImport(); return; }
  if (act === 'delete') { del(t.closest('[data-act]').dataset.id); return; }
  if (act === 'fav') { toggleFav(t.closest('[data-act]').dataset.id); return; }
  if (act === 'export') { openExport(); return; }
  if (act === 'inspo-more') { getIdeas(true); return; }
  if (act === 'plan-recipe') { const id = t.closest('[data-act]').dataset.id; openPlanDay(id, S.portions[id]); return; }
  if (act === 'plan-fill') { openPlanFill(); return; }
  if (act === 'inspo-stop') { inspoCtl?.abort(); S.inspo.loading = false; renderInspo(); return; }
  if (act === 'pantry-detect') { detectPantry(); return; }
  if (act === 'pantry-find') { findPantry(); return; }
  if (act === 'pantry-clear') { const P = S.inspo.pantry; P.photos.forEach(p => URL.revokeObjectURL(p.url)); Object.assign(P, { text: '', photos: [], have: [], matches: null, ideas: [], saved: {}, searched: false }); S.inspo.error = ''; renderInspo(); return; }
  if (act === 'have-add') { const inp = $('#haveIn'); addHave([inp.value]); renderInspo(); $('#haveIn')?.focus(); return; }
  const add = t.closest('[data-add]')?.dataset.add;
  if (add === 'ing') { $('#ings').insertAdjacentHTML('beforeend', ingRow()); $('#ings .ing:last-child .iq').focus(); return; }
  if (add === 'step') { $('#steps').insertAdjacentHTML('beforeend', stepRow()); renumber(); $('#steps .step:last-child textarea').focus(); return; }
  if (t.closest('[data-rm]')) { const row = t.closest('.row'); const box = row.parentElement; if (box.children.length > 1) row.remove(); else $$('input,textarea', row).forEach(i => i.value = ''); renumber(); return; }
  if (t.id === 'rmPhoto') { F.photoBlob = null; F.src = null; F.photoRemoved = true; $('#pv').innerHTML = PLATE; t.classList.add('hidden'); $('#cropPhoto').classList.add('hidden'); }
  if (t.id === 'cropPhoto') { recrop(); }
  const trm = t.closest('[data-tagrm]'); if (trm && F) { F.tags.splice(+trm.dataset.tagrm, 1); $('#tagEdit').innerHTML = tagEditHTML(); return; }
});
app.addEventListener('keydown', e => {
  if (e.target.id === 'tagIn' && (e.key === 'Enter' || e.key === ',')) { e.preventDefault(); addTag(e.target.value); return; }
  if (e.target.id === 'haveIn' && e.key === 'Enter') { e.preventDefault(); addHave([e.target.value]); renderInspo(); $('#haveIn')?.focus(); return; }
  if (e.target.id === 'tagIn' && e.key === 'Backspace' && !e.target.value && F?.tags.length) { F.tags.pop(); $('#tagEdit').innerHTML = tagEditHTML(); $('#tagIn').focus(); return; }
  if (e.key === 'Enter' && e.target.matches('.ing input')) { e.preventDefault(); const row = e.target.closest('.ing'); if (!row.nextElementSibling) { $('#ings').insertAdjacentHTML('beforeend', ingRow()); } row.nextElementSibling.querySelector('.iq').focus(); }
});
$('#tabAdd').addEventListener('click', openAdd);
$('#tabbar').addEventListener('click', e => { const a = e.target.closest('[data-tab]'); if (a && location.hash === '#' + a.dataset.tab) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); if (a.dataset.tab === 'suche') $('#q')?.focus(); } else if (a?.dataset.tab === 'suche') S.focusSearch = true; });
document.addEventListener('click', e => { const f = e.target.closest('#layer [data-act="fav"]'); if (f) toggleFav(f.dataset.id); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && layer.innerHTML) closeSheet(); });
window.addEventListener('hashchange', route);

// ---------- Start ----------
route();
(async () => {
  const c = window.claude;
  if (!c?.use) { S.slow = true; renderHome(); return; }
  const [db, user, assets, sample] = await Promise.all(['db','user','assets','sample'].map(n => c.use(n).catch(() => null)));
  S.db = db; S.user = user; S.assets = assets; S.sample = sample;
  if (user) {
    try { S.me = await user.id(); } catch {}
    try { const w = await user.can?.('data.write'); if (w === false) S.canWrite = false; } catch {}
  }
  if (!db) { S.canWrite = false; S.slow = true; app.innerHTML = '<div class="wrap"><p class="note">Die Rezeptdatenbank ist hier nicht erreichbar. Öffne Spoonful angemeldet über claude.ai.</p></div>'; return; }
  setTab(null); route();
  const timer = setTimeout(() => { S.slow = true; rerenderLive(); }, 10000);
  db.collection('recipes').onSnapshot(snap => {
    const cfg = snap.docs.find(d => d.id === CFG_ID); setCats(cfg ? cfg.data() : null);
    const isPlan = d => d.id.startsWith(PLAN_PREFIX);
    S.plan = Object.fromEntries(snap.docs.filter(isPlan).map(d => { const v = d.data() || {}; return [v.date || d.id.slice(PLAN_PREFIX.length), { date: v.date || d.id.slice(PLAN_PREFIX.length), items: Array.isArray(v.items) ? v.items : [] }]; }));
    S.recipes = snap.docs.filter(d => d.id !== CFG_ID && !isPlan(d)).map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt||0) - (a.createdAt||0));
    S.byId = Object.fromEntries(S.recipes.map(r => [r.id, r]));
    S.loaded = true;
    if (!snap.metadata.fromCache) { clearTimeout(timer); S.slow = false; }
    resolveNames(S.recipes.flatMap(r => [r.createdBy, r.updatedBy]));
    rerenderLive();
    if (!snap.metadata.fromCache) { addSamplePhotos(); backfillNutrition(); cleanupPlan(); }
  }, err => { clearTimeout(timer); S.loaded = true; S.slow = true; rerenderLive(); toast(err?.code === 'revoked' ? 'Zugriff wurde beendet.' : 'Verbindung zu den Rezepten verloren – bitte Seite neu öffnen.'); });
})();
}
</script>
